name: Mock pipeline tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install software dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Mock tests with network disabled
        env:
          LUMINA_TEST_OFFLINE: '1'
          PYTHONPATH: ${{ github.workspace }}/tests
          OPENAI_API_KEY: ''
          LANGCHAIN_TRACING_V2: 'false'
          OTEL_SDK_DISABLED: 'true'
        run: python -B -m unittest discover -s tests -v
      - name: Basic Python checks
        run: python -m ruff check --isolated --select E4,E7,E9,F --ignore E702 lumina run_pipeline.py tests
