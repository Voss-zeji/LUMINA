"""

[[questions]]
id = "habitat"
prompt = """
Return the habitat as {"Habitat": {"value": "forest", "evidence": "verbatim quote", "confidence_lv": 95}}. Use a null value when unreported."""
kind = "text"
items = ["Habitat"]
allowed_values = []
require_unit = false
require_experimental = false

[[questions]]
id = "biomass"
prompt = """
Extract biomass measurements as named item objects with scalar value, unit, evidence, confidence_lv and experimental (experiment identifier). Use a null value when unreported."""
kind = "numeric"
items = []
allowed_values = []
require_unit = true
require_experimental = true
